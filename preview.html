<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOWGoldMaker · 单页预览</title>
<style>
  :root {
    --gold: #e8c25a;
    --gold-hi: #ffd98a;
    --teal: #4ac7a8;
    --text: #ebedf2;
    --muted: #949ba6;
    --faint: #666c78;
    --ink: #211b0f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #23262f 0%, #14151a 55%, #0c0d11 100%);
    padding: 0 0 60px;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text);
    user-select: none;
    overflow-x: hidden;
  }
  h1 {
    position: fixed; left: 14px; bottom: 10px; z-index: 90;
    font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: 1.5px;
    opacity: .55; pointer-events: none;
  }
  h1 b { color: var(--gold); font-weight: 700; }

  /* ---------- 主窗口: 宽高 = 视口宽高的 90% ---------- */
  .window {
    position: relative;
    width: 90vw;
    height: 90vh;
    margin: 5vh auto 0;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,.55));
  }
  .window .shadow {
    position: absolute; inset: -22px -23px -22px -23px;
    background: url("WOWGoldMaker/Media/shadow.png") center / 100% 100% no-repeat;
    transform: translateY(-4px);
  }
  /* 九宫格拉伸, 圆角不会被拉变形 (对应 Lua 的 SetTextureSliceMargins) */
  .window .panel {
    position: absolute; inset: 0;
    border: 20px solid transparent;
    border-image: url("WOWGoldMaker/Media/panel.png") 24 fill stretch;
  }

  /* 内容层: 高度固定 356, 宽度由脚本按面板比例撑开, 整体居中缩放 */
  .content {
    position: absolute;
    left: 50%; top: 50%;
    width: 440px; height: 356px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
  }

  /* 氛围光斑 */
  .blob { position: absolute; pointer-events: none; mix-blend-mode: screen; }
  .blob.gold {
    width: 40%; height: 62%; top: -12%; left: 4%; opacity: .07;
    background: radial-gradient(circle, #e8c25a 0%, transparent 65%);
    animation: driftA 7s ease-in-out infinite alternate;
  }
  .blob.teal {
    width: 36%; height: 56%; bottom: -12%; right: 3%; opacity: .06;
    background: radial-gradient(circle, #4ac7a8 0%, transparent 65%);
    animation: driftB 8s ease-in-out infinite alternate;
  }
  @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(24px,10px); } }
  @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-20px,-8px); } }

  /* ---------- 第一行: 头像 / 问候 / 金币 / 等级 / 在线 / 设置 ---------- */
  .topbar {
    position: absolute; left: 20px; right: 14px; top: 14px; height: 26px;
    display: flex; align-items: center; gap: 12px;
  }
  .coin-wrap { position: relative; width: 26px; height: 26px; flex: 0 0 26px; }
  .coin-glow {
    position: absolute; inset: -18px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,194,90,.55) 0%, transparent 62%);
    animation: breathe 2.8s ease-in-out infinite alternate;
  }
  @keyframes breathe { from { opacity: .35; } to { opacity: .8; } }
  .coin {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8 0%, #e8c25a 45%, #a8842f 100%);
    box-shadow: inset 0 0 0 2px rgba(120,88,20,.55), 0 2px 6px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    animation: bob 3.2s ease-in-out infinite alternate;
  }
  .coin span { font-size: 13px; font-weight: 800; color: #7a5c18; text-shadow: 0 1px 0 rgba(255,235,170,.7); }
  @keyframes bob { from { opacity: .85; } to { opacity: 1; } }

  .greet { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .greet .name { color: #ffcf5c; }

  .money { font-size: 11px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
  .m-gold { color: #ffd100; }
  .m-silver { color: #e6edf5; }
  .m-copper { color: #b87333; }
  .money .unit { color: #fff; font-weight: 400; }

  .spacer { flex: 1 1 auto; }

  .lv { font-size: 11px; color: var(--text); white-space: nowrap; }
  .sess { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .mini {
    height: 20px; padding: 0 10px; border: none; border-radius: 6px;
    background: rgba(255,255,255,.10);
    color: var(--muted); font-size: 10px; font-weight: 600;
    font-family: inherit; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .mini:hover { background: rgba(255,255,255,.18); color: var(--text); }

  .close {
    width: 24px; height: 24px; border-radius: 8px; flex: 0 0 24px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; background: transparent; border: none; position: relative;
  }
  .close:hover { background: rgba(255,255,255,.14); }
  .close .x { position: absolute; width: 11px; height: 1.6px; background: var(--muted); border-radius: 1px; }
  .close .x1 { transform: rotate(45deg); }
  .close .x2 { transform: rotate(-45deg); }
  .close:hover .x { background: var(--text); }

  .divider { position: absolute; top: 47px; left: 20px; right: 20px; height: 1px; background: rgba(255,255,255,.07); }

  /* ---------- 第二行: 专业页签 + 视图切换 ---------- */
  .tabs { position: absolute; top: 56px; left: 20px; display: flex; gap: 6px; }
  .tab {
    height: 24px; padding: 0 12px 0 9px; border: none; border-radius: 7px;
    background: rgba(255,255,255,.07);
    color: var(--muted); font-size: 11px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background .15s, color .15s;
  }
  .tab:hover { background: rgba(255,255,255,.14); }
  .tab.on { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, #caa23e); color: var(--ink); }
  .tab .tico {
    width: 14px; height: 14px; border-radius: 3px; flex: 0 0 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; line-height: 1;
    font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", system-ui, sans-serif;
  }
  .tico.heal { background: linear-gradient(160deg,#7d2b2b,#3d1414); color: #ffd7d7; }
  .tico.cook { background: linear-gradient(160deg,#7a4a1c,#3a2210); color: #ffe0b0; }
  .switch { position: absolute; top: 56px; right: 14px; height: 24px; }

  /* ---------- 配方列表 ---------- */
  .list {
    position: absolute; top: 90px; left: 20px; right: 26px; bottom: 14px;
    overflow-y: auto; overflow-x: hidden;
  }
  .list::-webkit-scrollbar { width: 3px; }
  .list::-webkit-scrollbar-thumb { background: rgba(232,194,90,.5); border-radius: 2px; }
  .list::-webkit-scrollbar-track { background: rgba(255,255,255,.05); }

  .lrow {
    height: 30px; display: flex; align-items: center; gap: 10px;
    padding: 0 4px; border-radius: 5px;
  }
  .lrow.odd { background: rgba(255,255,255,.025); }
  .lrow:hover { background: rgba(255,255,255,.05); }

  .lrow .ico {
    width: 18px; height: 18px; border-radius: 4px; flex: 0 0 18px;
    background: linear-gradient(160deg, #4a4033, #241f18);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
  }
  .lrow .ico.heal { background: linear-gradient(160deg, #7d2b2b, #3d1414); box-shadow: inset 0 0 0 1px rgba(255,150,150,.28); }
  .lrow .ico.cook { background: linear-gradient(160deg, #7a4a1c, #3a2210); box-shadow: inset 0 0 0 1px rgba(255,190,110,.28); }

  .lrow .name {
    width: 34%; min-width: 0; font-size: 11px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lrow .name .dim { color: #9d9d9d; font-weight: 400; }
  .lrow .mats {
    flex: 1 1 auto; min-width: 0; font-size: 9px; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lrow .mats b { color: #fff; font-weight: 400; }
  .lrow .req {
    width: 46px; flex: 0 0 46px; text-align: right;
    font-size: 10px; color: #8a929e;
  }
  .lrow .req.gold { color: var(--gold); font-weight: 700; }

  /* ---------- 设置页 mock ---------- */
  .settings {
    width: 560px; margin: 48px auto 0;
    border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
    background: #191b21; padding: 22px 24px 26px;
  }
  .settings h2 { font-size: 16px; }
  .settings h2 span { color: var(--gold); }
  .settings .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .settings hr { border: none; border-top: 1px solid rgba(255,255,255,.1); margin: 16px 0; }
  .row { display: flex; align-items: center; gap: 10px; margin: 12px 0; cursor: pointer; }
  .box {
    width: 20px; height: 20px; border-radius: 6px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .row.on .box { background: rgba(232,194,90,.75); border-color: var(--gold); }
  .check { color: #211b0f; font-size: 13px; font-weight: 800; opacity: 0; }
  .row.on .check { opacity: 1; }
  .row span.lbl { font-size: 13px; }
  .settings .btnrow { display: flex; gap: 10px; margin-top: 16px; }
  .settings .gbtn {
    padding: 7px 18px; border-radius: 7px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.06); color: var(--text); font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .settings .gbtn:hover { background: rgba(255,255,255,.12); }
  .settings .help { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.9; }
  .settings .help b { color: var(--gold); font-weight: 600; }
</style>
</head>
<body>

<h1><b>WOWGOLDMAKER</b> · 单页预览 (v0.2.1)</h1>

<div class="window">
  <div class="shadow"></div>
  <div class="panel"></div>
  <div class="blob gold"></div>
  <div class="blob teal"></div>

  <div class="content">
    <!-- 第一行 -->
    <div class="topbar">
      <div class="coin-wrap">
        <div class="coin-glow"></div>
        <div class="coin"><span>G</span></div>
      </div>
      <div class="greet" id="greeting">下午好, <span class="name">冒险者</span></div>
      <div class="money" id="money">
        <span class="m-gold">12,345</span><span class="unit">金</span>
        <span class="m-silver">67</span><span class="unit">银</span>
        <span class="m-copper">89</span><span class="unit">铜</span>
      </div>
      <div class="spacer"></div>
      <div class="lv" id="lv">Lv.60</div>
      <div class="sess" id="sess">00:00</div>
      <button class="mini" id="setBtn">设置</button>
      <button class="close" title="关闭"><i class="x x1"></i><i class="x x2"></i></button>
    </div>

    <div class="divider"></div>

    <!-- 第二行 -->
    <div class="tabs" id="tabs"></div>
    <button class="mini switch" id="switchBtn">材料汇总</button>

    <!-- 配方列表 (内嵌, 默认急救) -->
    <div class="list" id="list"></div>
  </div>
</div>

<div class="settings">
  <h2><span>金币工坊</span> v0.2.1</h2>
  <div class="sub">魔兽世界无限服 · 金币工具箱</div>
  <hr>
  <div class="row on" id="row1"><div class="box"><span class="check">✓</span></div><span class="lbl">登录后自动呼出主界面</span></div>
  <div class="row on" id="row2"><div class="box"><span class="check">✓</span></div><span class="lbl">启用界面动画</span></div>
  <div class="btnrow">
    <button class="gbtn">重置窗口位置</button>
    <button class="gbtn">打开主界面</button>
  </div>
  <div class="help">
    <b>/wgm</b> 开关主界面 &nbsp;·&nbsp; <b>/wgm reset</b> 重置位置 &nbsp;·&nbsp; <b>/wgm config</b> 打开本设置页
  </div>
</div>

<script>
  /* ==================== 主面板尺寸 ====================
     对应 UI.lua 的 ComputeLayout:
       面板 = 视口宽高的 90%; 内容高度固定 356, 宽度按面板比例撑开, 整体等比缩放居中 */
  const winEl = document.querySelector(".window");
  const contentEl = document.querySelector(".content");
  const BASE_W = 440, BASE_H = 356, PAD = 24, SCALE_MAX = 2.6;

  function layoutHome() {
    const pw = winEl.clientWidth, ph = winEl.clientHeight;
    const innerW = pw - PAD * 2, innerH = ph - PAD * 2;
    let k = Math.min(innerH / BASE_H, innerW / BASE_W);
    if (!(k > 0)) k = 1;
    k = Math.min(k, SCALE_MAX);
    const cw = Math.max(BASE_W, innerW / k);

    contentEl.style.width = cw + "px";
    contentEl.style.height = BASE_H + "px";
    contentEl.style.transform = `translate(-50%, -50%) scale(${k})`;
  }
  window.addEventListener("resize", layoutHome);
  layoutHome();

  /* ==================== 数据 ====================
     预览页为示例数据 (游戏内由 ProfData.lua 提供完整 32/124 条) */
  const PROF = {
    "first-aid": {
      name: "急救", icon: "✚", cls: "heal",
      rows: [
        ["亚麻绷带", 1, 1, [["亚麻布", 1]]],
        ["初级治疗药水", 1, 1, [["空瓶", 1], ["宁神花", 1]]],
        ["厚亚麻绷带", 1, 40, [["亚麻布", 2]]],
        ["毛料绷带", 1, 80, [["毛料", 1]]],
        ["抗毒药剂", 3, 80, [["小毒囊", 1]]],
        ["次级治疗药水", 1, 110, [["空瓶", 1], ["石南草", 1]]],
        ["厚毛料绷带", 1, 115, [["毛料", 2]]],
        ["丝绸绷带", 1, 150, [["丝绸", 1]]],
        ["厚丝绸绷带", 1, 180, [["丝绸", 2]]],
        ["魔纹绷带", 1, 210, [["魔纹布", 1]]],
        ["厚魔纹绷带", 1, 240, [["魔纹布", 2]]],
        ["符文绷带", 1, 260, [["符文布", 1]]],
        ["厚符文绷带", 1, 290, [["符文布", 2]]],
      ],
    },
    "cooking": {
      name: "烹饪", icon: "🍖", cls: "cook",
      rows: [
        ["香料面包", 1, 1, [["简单面粉", 1], ["空瓶", 1]]],
        ["烤野猪排", 1, 1, [["野猪肋排", 1]]],
        ["熏熊肉", 1, 1, [["熊肉", 1]]],
        ["香脆蜘蛛肉", 1, 40, [["粘稠的蜘蛛肉", 1]]],
        ["长嘴泥鳅", 1, 50, [["新鲜的长嘴泥鳅", 1]]],
        ["美味小鱼", 1, 50, [["新鲜的美味小鱼", 1]]],
        ["蟹肉蛋糕", 1, 75, [["新鲜的蟹肉", 1]]],
        ["烤迅猛龙肉", 1, 100, [["迅猛龙肉", 1]]],
        ["炖龙虾", 1, 150, [["龙虾", 1]]],
        ["白鳞鲑鱼", 1, 175, [["新鲜的白鳞鲑鱼", 1]]],
        ["夜鳞鱼汤", 1, 225, [["新鲜的夜鳞鲷鱼", 1]]],
        ["水煮阳鳞鲑鱼", 1, 250, [["新鲜的阳鳞鲑鱼", 1]]],
      ],
    },
  };

  let curKey = "first-aid", curMode = "list";

  const $tabs = document.getElementById("tabs");
  const $list = document.getElementById("list");
  const $switch = document.getElementById("switchBtn");

  function summarize(rows) {
    const agg = new Map();
    for (const [, , , mats] of rows) {
      for (const [n, c] of mats) agg.set(n, (agg.get(n) || 0) + c);
    }
    return [...agg.entries()].sort((a, b) => b[1] - a[1]);
  }

  function matsText(mats) {
    return mats.map(([n, c]) => `${n}<b>×${c}</b>`).join("&nbsp;&nbsp;");
  }

  function renderTabs() {
    $tabs.innerHTML = "";
    for (const key of Object.keys(PROF)) {
      const p = PROF[key];
      const b = document.createElement("button");
      b.className = "tab" + (key === curKey ? " on" : "");
      b.innerHTML = `<span class="tico ${p.cls}">${p.icon}</span>${p.name}`;
      b.onclick = () => { curKey = key; renderTabs(); renderList(); };
      $tabs.appendChild(b);
    }
  }

  function renderList() {
    const p = PROF[curKey];
    const cls = p.cls;
    let html = "";

    if (curMode === "mats") {
      summarize(p.rows).forEach(([n, c], i) => {
        html += `<div class="lrow${i % 2 ? " odd" : ""}">
          <div class="ico ${cls}"></div>
          <div class="name">${n}</div>
          <div class="mats"></div>
          <div class="req gold">×${c}</div>
        </div>`;
      });
    } else {
      p.rows.forEach(([n, made, req, mats], i) => {
        const md = made > 1 ? ` <span class="dim">×${made}</span>` : "";
        html += `<div class="lrow${i % 2 ? " odd" : ""}">
          <div class="ico ${cls}"></div>
          <div class="name">${n}${md}</div>
          <div class="mats">${matsText(mats)}</div>
          <div class="req">[${req}]</div>
        </div>`;
      });
    }

    $list.innerHTML = html;
    $list.scrollTop = 0;
    $switch.textContent = curMode === "list" ? "材料汇总" : "配方列表";
  }

  $switch.onclick = () => {
    curMode = curMode === "list" ? "mats" : "list";
    renderList();
  };

  renderTabs();
  renderList();

  /* ==================== 其它 ==================== */
  for (const id of ["row1", "row2"]) {
    document.getElementById(id).onclick = e => e.currentTarget.classList.toggle("on");
  }

  const t0 = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    document.getElementById("sess").textContent = mm + ":" + ss;
  }, 1000);
</script>
</body>
</html>
