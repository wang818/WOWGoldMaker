<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOWGoldMaker · 单页预览</title>
<style>
  :root {
    --gold: #e8c25a;
    --gold-hi: #ffd98a;
    --teal: #4ac7a8;
    --text: #ebedf2;
    --muted: #949ba6;
    --faint: #666c78;
    --ink: #211b0f;
    --green: #66cc73;
    --red: #eb6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #23262f 0%, #14151a 55%, #0c0d11 100%);
    padding: 0 0 60px;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text);
    user-select: none;
    overflow-x: hidden;
  }
  h1 {
    position: fixed; left: 14px; bottom: 10px; z-index: 90;
    font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: 1.5px;
    opacity: .55; pointer-events: none;
  }
  h1 b { color: var(--gold); font-weight: 700; }

  /* ---------- 主窗口: 宽度 = 视口宽度 50%, 贴在右侧、垂直居中 ---------- */
  .window {
    position: fixed;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    width: 50vw;
    /* 高度按设计稿比例 (440:440 = 1:1), 上限 90vh —— 对应 UI.lua 的 PanelSize */
    height: min(50vw, 90vh);
    filter: drop-shadow(0 18px 30px rgba(0,0,0,.55));
    z-index: 10;
  }
  .window .shadow {
    position: absolute; inset: -22px -23px -22px -23px;
    background: url("WOWGoldMaker/Media/shadow.png") center / 100% 100% no-repeat;
    transform: translateY(-4px);
  }
  /* 九宫格拉伸, 圆角不会被拉变形 (对应 Lua 的 SetTextureSliceMargins) */
  .window .panel {
    position: absolute; inset: 0;
    border: 20px solid transparent;
    border-image: url("WOWGoldMaker/Media/panel.png") 24 fill stretch;
  }

  /* 内容层: 高度固定 356, 宽度由脚本按面板比例撑开, 整体居中缩放 */
  .content {
    position: absolute;
    left: 50%; top: 50%;
    width: 440px; height: 440px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
  }

  /* 氛围光斑 */
  .blob { position: absolute; pointer-events: none; mix-blend-mode: screen; }
  .blob.gold {
    width: 40%; height: 62%; top: -12%; left: 4%; opacity: .07;
    background: radial-gradient(circle, #e8c25a 0%, transparent 65%);
    animation: driftA 7s ease-in-out infinite alternate;
  }
  .blob.teal {
    width: 36%; height: 56%; bottom: -12%; right: 3%; opacity: .06;
    background: radial-gradient(circle, #4ac7a8 0%, transparent 65%);
    animation: driftB 8s ease-in-out infinite alternate;
  }
  @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(24px,10px); } }
  @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-20px,-8px); } }

  /* ---------- 第一行: 头像 / 问候 / 金币 / 等级 / 在线 / 设置 ---------- */
  .topbar {
    position: absolute; left: 20px; right: 14px; top: 10px; height: 22px;
    display: flex; align-items: center; gap: 10px;
  }
  .coin-wrap { position: relative; width: 22px; height: 22px; flex: 0 0 22px; }
  .coin-glow {
    position: absolute; inset: -18px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,194,90,.55) 0%, transparent 62%);
    animation: breathe 2.8s ease-in-out infinite alternate;
  }
  @keyframes breathe { from { opacity: .35; } to { opacity: .8; } }
  .coin {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8 0%, #e8c25a 45%, #a8842f 100%);
    box-shadow: inset 0 0 0 2px rgba(120,88,20,.55), 0 2px 6px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    animation: bob 3.2s ease-in-out infinite alternate;
  }
  .coin span { font-size: 12px; font-weight: 800; color: #7a5c18; text-shadow: 0 1px 0 rgba(255,235,170,.7); }
  @keyframes bob { from { opacity: .85; } to { opacity: 1; } }

  .greet { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .greet .name { color: #ffcf5c; }

  .money { font-size: 10px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
  /* 货币三段配色 (金=亮黄 / 银=银白 / 铜=古铜), 对应游戏里的 T.COIN_CODE */
  .m-gold, .mg { color: #ffd100; }
  .m-silver, .ms { color: #e6edf5; }
  .m-copper, .mc { color: #b87333; }

  .spacer { flex: 1 1 auto; }

  .lv { font-size: 10px; color: var(--text); white-space: nowrap; }
  .sess { font-size: 10px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .mini {
    height: 18px; padding: 0 8px; border: none; border-radius: 5px;
    background: rgba(255,255,255,.10);
    color: var(--muted); font-size: 9px; font-weight: 600;
    font-family: inherit; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .mini:hover { background: rgba(255,255,255,.18); color: var(--text); }

  .close {
    width: 22px; height: 22px; border-radius: 7px; flex: 0 0 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; background: transparent; border: none; position: relative;
  }
  .close:hover { background: rgba(255,255,255,.14); }
  .close .x { position: absolute; width: 11px; height: 1.6px; background: var(--muted); border-radius: 1px; }
  .close .x1 { transform: rotate(45deg); }
  .close .x2 { transform: rotate(-45deg); }
  .close:hover .x { background: var(--text); }

  .divider { position: absolute; top: 36px; left: 20px; right: 20px; height: 1px; background: rgba(255,255,255,.07); }

  /* ---------- 第二行: 专业页签 + 视图切换 ---------- */
  .tabs { position: absolute; top: 44px; left: 20px; display: flex; gap: 6px; }
  .tab {
    height: 20px; padding: 0 10px 0 7px; border: none; border-radius: 6px;
    background: rgba(255,255,255,.07);
    color: var(--muted); font-size: 10px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    transition: background .15s, color .15s;
  }
  .tab:hover { background: rgba(255,255,255,.14); }
  .tab.on { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, #caa23e); color: var(--ink); }
  .tab .tico {
    width: 12px; height: 12px; border-radius: 3px; flex: 0 0 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; line-height: 1;
    font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", system-ui, sans-serif;
  }
  .tico.heal { background: linear-gradient(160deg,#7d2b2b,#3d1414); color: #ffd7d7; }
  .tico.cook { background: linear-gradient(160deg,#7a4a1c,#3a2210); color: #ffe0b0; }
  .tico.alch { background: linear-gradient(160deg,#4a2a63,#251636); color: #e3cdff; }
  .switch { position: absolute; top: 44px; right: 14px; height: 20px; }

  /* ---------- 配方列表 ---------- */
  .list {
    position: absolute; top: 72px; left: 20px; right: 26px; bottom: 10px;
    overflow-y: auto; overflow-x: hidden;
  }
  .list::-webkit-scrollbar { width: 3px; }
  .list::-webkit-scrollbar-thumb { background: rgba(232,194,90,.5); border-radius: 2px; }
  .list::-webkit-scrollbar-track { background: rgba(255,255,255,.05); }

  /* ---------- 页面内浮层提示 (对应 UI.lua 的 ns.UI.Notify) ---------- */
  /* ---------- NPC 买价录入弹窗 (对应 ns.UI.EditNpcPrice) ----------
     300x126 设计像素, 居中盖在面板上; 金/银/铜 三个输入框 + 一行提示 + 三个按钮 */
  .npc-editor {
    position: absolute; left: 50%; top: 50%;
    width: 300px; height: 126px;
    transform: translate(-50%, -50%);
    border-radius: 10px;
    background: linear-gradient(160deg, #23201a, #12131a);
    box-shadow: 0 14px 34px rgba(0,0,0,.6), inset 0 0 0 1px rgba(232,194,90,.20);
    padding: 12px 14px; box-sizing: border-box;
    display: none; z-index: 5;
  }
  .npc-editor.on { display: block; }
  .ne-title { font-size: 11px; font-weight: 600; color: var(--gold); }
  .ne-who { font-size: 9px; color: var(--muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ne-row { margin-top: 9px; display: flex; gap: 2px; }
  .ne-cell { flex: 1; display: flex; align-items: center; gap: 4px; }
  .ne-cell b {
    flex: 1; height: 20px; border-radius: 5px; box-sizing: border-box;
    background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    display: flex; align-items: center; padding: 0 5px;
    font-size: 11px; font-weight: 400; color: var(--text);
  }
  .ne-cell span { flex: 0 0 14px; font-size: 9px; color: var(--faint); }
  /* 单位标签本身也要钱币色 (金/银/铜各一色) */
  .ne-cell .mg { color: #ffd100; }
  .ne-cell .ms { color: #e6edf5; }
  .ne-cell .mc { color: #b87333; }
  .ne-hint { font-size: 8px; color: var(--faint); margin-top: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ne-btns { position: absolute; right: 14px; bottom: 12px; display: flex; gap: 6px; }
  .ne-btns button {
    width: 54px; height: 18px; border: 0; border-radius: 4px; cursor: pointer;
    font-size: 9px; color: var(--muted); background: rgba(255,255,255,.10);
    font-family: inherit;
  }
  .ne-btns button:hover { background: rgba(255,255,255,.18); color: var(--text); }
  .ne-btns button.primary { background: rgba(232,194,90,.22); color: var(--gold); }
  .ne-btns button.primary:hover { background: rgba(232,194,90,.32); color: var(--gold-hi); }

  .toast {
    position: absolute; left: 50%; bottom: 18px;
    height: 26px; max-width: calc(100% - 40px);
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px 0 9px; border-radius: 8px;
    background: rgba(15, 17, 21, .96);
    box-shadow: 0 6px 18px rgba(0,0,0,.45), inset 0 0 0 1px rgba(232,194,90,.16);
    color: var(--gold); font-size: 10px; white-space: nowrap;
    transform: translate(-50%, 6px); opacity: 0; pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  .toast i {
    width: 3px; height: 14px; border-radius: 2px;
    background: var(--gold); flex: 0 0 3px;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* 一条配方 = 一行商品 + 若干行材料 (一样材料一行),
     材料行左缩进一个商品图标的宽度, 空出来的那一段画从属虚线连回商品行 */
  .blk { display: flex; flex-direction: column; border-radius: 4px; }
  .blk.odd { background: rgba(255,255,255,.025); }
  .blk:hover { background: rgba(255,255,255,.05); }

  .blk .pline { height: 26px; display: flex; align-items: center; gap: 7px; padding: 0; }

  .blk .ico {
    width: 15px; height: 15px; border-radius: 4px; flex: 0 0 15px;
    background: linear-gradient(160deg, #4a4033, #241f18);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
  }
  .blk .ico.heal { background: linear-gradient(160deg, #7d2b2b, #3d1414); box-shadow: inset 0 0 0 1px rgba(255,150,150,.28); }
  .blk .ico.cook { background: linear-gradient(160deg, #7a4a1c, #3a2210); box-shadow: inset 0 0 0 1px rgba(255,190,110,.28); }
  .blk .ico.alch { background: linear-gradient(160deg, #4a2a63, #251636); box-shadow: inset 0 0 0 1px rgba(205,170,255,.28); }

  /* 商品列: 第一行名称, 第二行售价 */
  .blk .prod {
    flex: 0 0 var(--tw, 180px); min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
  }
  .blk .pname {
    font-size: 10px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .blk .pname .dim { color: #9d9d9d; font-weight: 400; }
  .blk .pname .pnpc { font-size: 7px; font-weight: 400; color: var(--muted); margin-left: 8px; }
  .blk .psell { font-size: 8px; color: var(--gold); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .blk .psell.dim { color: var(--faint); }
  .blk .psell.bad { color: var(--red); }

  /* 材料行: 一行一样材料 —— [从属虚线] 图标 名字 .......... 金额 */
  .mlines { position: relative; padding-bottom: 2px; }
  /* 竖虚线: 从商品图标下沿一直拖到最后一行材料, 一串 2px 小段 (对应 LayoutTree) */
  .mlines::before {
    content: ""; position: absolute; left: 6px; top: -2px; bottom: 7px; width: 1px;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,.20) 0 2px, rgba(255,255,255,0) 2px 5px);
  }
  .mlines .mline {
    position: relative; height: 13px; margin-left: 22px;
    display: flex; align-items: center; gap: 4px; padding-right: 48px;
  }
  /* 每行伸向竖虚线的一小段横线 */
  .mlines .mline::before {
    content: ""; position: absolute; left: -14px; width: 11px; height: 1px;
    background: rgba(255,255,255,.16);
  }
  .mlines .mline:hover { background: rgba(255,255,255,.06); border-radius: 3px; }
  .mlines .mico {
    width: 9px; height: 9px; border-radius: 2px; flex: 0 0 9px;
    background: linear-gradient(160deg, #4a4033, #241f18);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
  }
  .mlines .mname {
    flex: 1 1 auto; min-width: 0; font-size: 7px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mlines .mname.dim { color: #8a929e; }
  /* 需要几个 (×3): 单独一列, 长名字也不会把它挤掉 */
  .mlines .mcnt {
    flex: 0 0 24px; margin-left: 2px; text-align: right; font-size: 7px;
    color: var(--faint); white-space: nowrap;
  }
  /* NPC 两列: 卖价 (客户端自带, 只读) + 买价 (玩家手记, 可点) */
  .mlines .mnpc {
    flex: 0 0 54px; margin-left: 2px; text-align: right; font-size: 7px;
    color: var(--muted); white-space: nowrap; overflow: hidden;
  }
  .mlines .mbuy {
    flex: 0 0 46px; margin-left: 2px; text-align: right; font-size: 7px;
    color: var(--teal); white-space: nowrap; overflow: hidden;
    cursor: pointer;
  }
  .mlines .mbuy.empty { color: var(--faint); }
  .mlines .mbuy:hover { color: var(--gold-hi); }
  .mlines .mprice {
    flex: 0 0 84px; margin-left: 6px; text-align: right; font-size: 7px; color: var(--gold);
    white-space: nowrap; overflow: hidden;
  }
  .mlines .mprice.dim { color: var(--faint); }
  .mlines .mprice.bad { color: var(--red); }

  .blk .req {
    flex: 0 0 auto; text-align: right;
    font-size: 9px; color: #8a929e;
  }
  .blk .req.gold { color: var(--gold); font-weight: 700; }

  /* 价格列 + 查价按钮: 两行盈亏 (上 = 拍卖行, 下 = NPC) */
  .blk .prices {
    flex: 0 0 var(--pw, 78px); display: flex; flex-direction: column;
    align-items: flex-end; justify-content: center; gap: 1px;
    line-height: 1.1;
  }
  .blk .price, .blk .npcprice {
    font-size: 8px; color: var(--faint); white-space: nowrap; overflow: hidden;
    max-width: 100%;
  }
  .blk .price.good, .blk .npcprice.good { color: var(--green); font-weight: 600; }
  .blk .price.bad, .blk .npcprice.bad  { color: var(--red); font-weight: 600; }
  .blk .price.gold, .blk .npcprice.gold { color: var(--gold); }
  .blk .price.wait, .blk .npcprice.wait { color: var(--gold); }
  .blk .qbtn {
    flex: 0 0 40px; height: 14px; border-radius: 4px;
    background: rgba(255,255,255,.10);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: var(--muted); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .blk .qbtn:hover { background: rgba(255,255,255,.20); color: var(--text); }

  /* ---------- 行悬停提示 (对应 ns.UI.ShowRowTooltip) ----------
     整块 UI 收小一档后长标题更容易被截断, 悬停给出完整名字 + 材料清单 */
  .tip {
    position: fixed; z-index: 60; pointer-events: none; display: none;
    min-width: 130px; max-width: 260px;
    padding: 8px 10px 9px; border-radius: 8px;
    background: rgba(10, 12, 16, .97);
    box-shadow: 0 8px 22px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.10);
  }
  .tip.on { display: block; }
  .tip .t { font-size: 12px; font-weight: 700; color: #fff; line-height: 1.35; }
  .tip .sub { margin-top: 3px; font-size: 10px; color: var(--muted); }
  .tip .mrow {
    display: flex; justify-content: space-between; gap: 14px;
    font-size: 10px; color: #d8dbe0; margin-top: 2px;
  }
  .tip .mrow span:last-child { color: var(--muted); }
  .tip .hint { margin-top: 6px; font-size: 10px; color: var(--faint); }

  /* ---------- 设置页 mock ---------- */
  /* 预览页专用的演示控件 (游戏里没有这一块) */
  .demo {
    position: fixed; left: 24px; bottom: 18px; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    margin: 0; font-size: 11px; color: var(--faint);
  }
  .demo label { display: flex; align-items: center; gap: 7px; cursor: pointer; color: var(--muted); }
  .demo input { accent-color: #e8c25a; }
  .settings {
    position: fixed; left: 24px; top: 50%; transform: translateY(-50%);
    width: min(42vw, 520px); z-index: 5;
    border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
    background: #191b21; padding: 22px 24px 26px;
  }
  .settings h2 { font-size: 16px; }
  .settings h2 span { color: var(--gold); }
  .settings .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .settings hr { border: none; border-top: 1px solid rgba(255,255,255,.1); margin: 16px 0; }
  .row { display: flex; align-items: center; gap: 10px; margin: 12px 0; cursor: pointer; }
  .box {
    width: 20px; height: 20px; border-radius: 6px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .row.on .box { background: rgba(232,194,90,.75); border-color: var(--gold); }
  .check { color: #211b0f; font-size: 13px; font-weight: 800; opacity: 0; }
  .row.on .check { opacity: 1; }
  .row span.lbl { font-size: 13px; }
  .settings .btnrow { display: flex; gap: 10px; margin-top: 16px; }
  .settings .gbtn {
    padding: 7px 18px; border-radius: 7px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.06); color: var(--text); font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .settings .gbtn:hover { background: rgba(255,255,255,.12); }
  .settings .help { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.9; }
  .settings .help b { color: var(--gold); font-weight: 600; }
</style>
</head>
<body>

<h1><b>WOWGOLDMAKER</b> · 单页预览 (v0.8.5)</h1>

<div class="window">
  <div class="shadow"></div>
  <div class="panel"></div>
  <div class="blob gold"></div>
  <div class="blob teal"></div>

  <div class="content">
    <!-- 第一行 -->
    <div class="topbar">
      <div class="coin-wrap">
        <div class="coin-glow"></div>
        <div class="coin"><span>G</span></div>
      </div>
      <div class="greet" id="greeting">下午好, <span class="name">冒险者</span></div>
      <div class="money" id="money">
        <span class="m-gold">12,345金</span>
        <span class="m-silver">67银</span>
        <span class="m-copper">89铜</span>
      </div>
      <div class="spacer"></div>
      <div class="lv" id="lv">Lv.60</div>
      <div class="sess" id="sess">00:00</div>
      <button class="mini" id="setBtn">设置</button>
      <button class="close" title="关闭"><i class="x x1"></i><i class="x x2"></i></button>
    </div>

    <div class="divider"></div>

    <!-- 第二行 -->
    <div class="tabs" id="tabs"></div>
    <button class="mini switch" id="switchBtn">材料汇总</button>

    <!-- 配方列表 (内嵌, 默认急救) -->
    <div class="list" id="list"></div>

    <!-- 页面内提示 (拍卖行未打开等), 对应 ns.UI.Notify -->
    <div class="toast" id="toast"><i></i><span id="toastText"></span></div>

    <!-- NPC 买价录入弹窗, 对应 ns.UI.EditNpcPrice -->
    <div class="npc-editor" id="npcEditor">

<script>
  /* ==================== 主面板尺寸 ====================
     对应 UI.lua 的 PanelSize + ComputeLayout:
       面板宽度 = 视口宽度 50%, 高度按设计稿比例 356/440 (上限 90vh);
       内容高度固定 440, 宽度按面板比例撑开, 整体等比缩放居中 */
  const winEl = document.querySelector(".window");
  const contentEl = document.querySelector(".content");
  const BASE_W = 440, BASE_H = 440, PAD = 24, SCALE_MAX = 2.6;

  function layoutHome() {
    const pw = winEl.clientWidth, ph = winEl.clientHeight;
    const innerW = pw - PAD * 2, innerH = ph - PAD * 2;
    let k = Math.min(innerH / BASE_H, innerW / BASE_W);
    if (!(k > 0)) k = 1;
    k = Math.min(k, SCALE_MAX);
    const cw = Math.max(BASE_W, innerW / k);

    contentEl.style.width = cw + "px";
    contentEl.style.height = BASE_H + "px";
    contentEl.style.transform = `translate(-50%, -50%) scale(${k})`;
  }
  window.addEventListener("resize", layoutHome);
  layoutHome();

  /* ==================== 数据 ====================
     预览页为示例数据 (游戏内由 ProfData.lua 提供完整 32/124/181 条) */
  const PROF = {
    "first-aid": {
      name: "急救", icon: "✚", cls: "heal",
      rows: [

        ["厚亚麻绷带", 1, 40, [["亚麻布", 2]]],
        ["毛料绷带", 1, 80, [["毛料", 1]]],

        ["厚毛料绷带", 1, 115, [["毛料", 2]]],
        ["丝绸绷带", 1, 150, [["丝绸", 1]]],
        ["厚丝绸绷带", 1, 180, [["丝绸", 2]]],
        ["魔纹绷带", 1, 210, [["魔纹布", 1]]],
        ["厚魔纹绷带", 1, 240, [["魔纹布", 2]]],

      rows: [
        ["香料面包", 1, 1, [["简单面粉", 1], ["空瓶", 1]]],
        ["烤野猪排", 1, 1, [["野猪肋排", 1]]],
        ["熏熊肉", 1, 1, [["熊肉", 1]]],
        ["香脆蜘蛛肉", 1, 40, [["粘稠的蜘蛛肉", 1]]],
        ["长嘴泥鳅", 1, 50, [["新鲜的长嘴泥鳅", 1]]],
        ["美味小鱼", 1, 50, [["新鲜的美味小鱼", 1]]],
        ["蟹肉蛋糕", 1, 75, [["新鲜的蟹肉", 1]]],
        ["烤迅猛龙肉", 1, 100, [["迅猛龙肉", 1]]],
        ["炖龙虾", 1, 150, [["龙虾", 1]]],
        ["白鳞鲑鱼", 1, 175, [["新鲜的白鳞鲑鱼", 1]]],
        ["夜鳞鱼汤", 1, 225, [["新鲜的夜鳞鲷鱼", 1]]],
        ["水煮阳鳞鲑鱼", 1, 250, [["新鲜的阳鳞鲑鱼", 1]]],
      ],
    },
    "alchemy": {
      name: "炼金术", icon: "⚗", cls: "alch",
      rows: [
        ["初级治疗药水", 1, 1, [["空瓶", 1], ["宁神花", 1]]],
        ["初级法力药水", 1, 25, [["空瓶", 1], ["魔皇草", 1], ["宁神花", 1]]],
        ["次级治疗药水", 1, 55, [["空瓶", 1], ["石南草", 1], ["宁神花", 1]]],
        ["治疗药水", 1, 110, [["铅瓶", 1], ["跌打草", 1], ["石南草", 1]]],
        ["强力治疗药水", 1, 155, [["铅瓶", 1], ["皇血草", 1], ["石南草", 1]]],
        ["点金石", 1, 225, [["铁锭", 4], ["黑色硫酸盐", 1], ["秘银杆", 1], ["火焰之心", 1], ["元素之土", 1], ["黑珍珠", 1], ["紫莲花", 4]]],
        ["强效治疗药水", 1, 275, [["水晶瓶", 1], ["太阳草", 1], ["卡德加的胡须", 1]]],
        ["泰坦合剂", 1, 300, [["格罗姆之血", 7], ["山鼠草", 3], ["石鳞鱼油", 1], ["黑莲花", 1], ["水晶瓶", 1]]],
      ],
    },
  };

  let curKey = "first-aid", curMode = "list";
  const $ahOpen = document.getElementById("ahOpen");

  /* 悬停是否附带配方/价格 (对应存档里的 db.tipExtra, 游戏里默认关) */
  const $tipExtra = document.getElementById("tipExtra");
  let tipExtra = new URLSearchParams(location.search).get("extra") === "1";
  $tipExtra.checked = tipExtra;
  $tipExtra.addEventListener("change", () => {
    tipExtra = $tipExtra.checked;
    $tip.classList.remove("on");       // 收起, 下次移动鼠标按新设置重新生成
    tipTarget = null;
  });

  const $tabs = document.getElementById("tabs");
  const $list = document.getElementById("list");
  const $switch = document.getElementById("switchBtn");

  /* ---------- 页面内提示 (对应 UI.lua 的 ns.UI.Notify) ----------
     自动淡出, 点一下提前收起; 同时只显示最后一条 */
  const $toast = document.getElementById("toast");
  const $toastText = document.getElementById("toastText");
  let toastTimer = null;
  function showToast(msg, hold) {
    $toastText.textContent = msg;
    $toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove("on"), hold || 4500);
  }
  $toast.onclick = () => { clearTimeout(toastTimer); $toast.classList.remove("on"); };

  function summarize(rows) {
    const agg = new Map();
    for (const [, , , mats] of rows) {
      for (const [n, c] of mats) agg.set(n, (agg.get(n) || 0) + c);
    }
    return [...agg.entries()].sort((a, b) => b[1] - a[1]);
  }

  /* NPC 价格 (演示用假数据, 游戏里卖价来自客户端物品库、买价来自玩家手记)
     sell = 卖给商人, buy = 从商人买 (只有一部分材料记过) */
  function hashOf(s) {
    let h = 7;
    for (const ch of s) h = (h * 131 + ch.codePointAt(0)) % 999983;
    return h;
  }
  function npcSellOf(name) { return ((hashOf(name) % 60) + 1) * 100 + 50; }
  function npcBuyOf(name) { const h = hashOf(name + "#buy"); return h % 3 === 0 ? ((h % 25) + 1) * 100 : 0; }

  /* 材料行: 一样材料一行 —— 图标 / 名字 / NPC 卖价 / NPC 买价 / 金额 (查价后填) */
  function matLines(mats) {
    if (!mats.length) return "";
    return `<div class="mlines">` + mats.map(([n, c]) => {
      const buy = npcBuyOf(n);
      return `<div class="mline" data-cnt="${c}" data-n="${n}">
         <i class="mico"></i>
         <div class="mname">${n}</div>
         <div class="mcnt">×${c}</div>
         <div class="mnpc">卖 ${money(npcSellOf(n))}</div>
         <div class="mbuy${buy ? "" : " empty"}">${buy ? "买 " + money(buy) : "＋买价"}</div>
         <div class="mprice"></div>
       </div>`;
    }).join("") + `</div>`;
  }

  /* 查价相关的小工具 (与 Auction.lua 的口径一致: 铜 → 金/银) */
  function money(c) {
    c = Math.abs(Math.round(c));
    const g = Math.floor(c / 10000);
    const s = Math.floor((c % 10000) / 100);
    if (g >= 10000) return (g / 10000).toFixed(1) + "万金";
    if (g > 0) return s > 0 && g < 1000 ? `${g}金${s}银` : `${g}金`;
    if (s > 0) return `${s}银`;
    return `${c}铜`;
  }

  /* 精确到 1 铜 (对应 AH.MoneyEx): 1金 = 100银 = 100铜。
     位数规则: 高位为 0 不写, 铜位一定写 (0 铜也写); 只有铜时不写金银 ——
       12金34银56铜 / 1金23银0铜 / 5银0铜 / 45铜 */
  function moneyEx(c) {
    c = Math.abs(Math.round(c));
    const g = Math.floor(c / 10000);
    const s = Math.floor((c % 10000) / 100);
    const k = c % 100;
    if (g >= 100000) return "≈" + (g / 10000).toFixed(1) + "万金";
    if (g > 0) return g + "金" + s + "银" + k + "铜";
    if (s > 0) return s + "银" + k + "铜";
    return k + "铜";
  }

  /* 材料行金额: 与 UI.lua 的 MatPriceText 同一套分档 ——
     数量 > 1 时真正花的是「单价 × 数量」, 面板拖窄时按可用宽度挑一种:
       宽格  1金20银×3 = 3金60银
       中格  ×3 3金60银
       窄格  共3金60银
       极窄  3金60银                                  */
  function approxWidth(s) {
    let w = 0;
    for (const ch of s) w += /[\u2e80-\u9fff\uff00-\uffef]/.test(ch) ? 8 : 4.4;
    return w;
  }
  function matPriceHTML(unit, cnt, cw) {
    const u = moneyEx(unit);
    if (!(cnt > 1)) return u;
    const t = moneyEx(unit * cnt);
    const avail = cw - 2;
    const full = `${u}×${cnt} = ${t}`;
    if (approxWidth(full) <= avail) return full;
    const mid = `×${cnt} ${t}`;
    if (approxWidth(mid) <= avail) return `<span class="dim">×${cnt}</span> ${t}`;
    const tot = `共${t}`;
    if (approxWidth(tot) <= avail) return tot;
    return t;
  }

  /* 一行盈亏 (拍卖行 / NPC 共用): "AH 盈1金23银45铜" */
  function plHTML(label, v) {
    if (v === null || v === undefined) return "";
    const cls = v > 0 ? "good" : v < 0 ? "bad" : "";
    const word = v > 0 ? "盈" : v < 0 ? "亏" : "持平";
    const val = v === 0 ? "" : moneyEx(v);
    return `<div class="${label === "AH" ? "price" : "npcprice"} ${cls}">${label} ${word}${val}</div>`;
  }

  /* 金额统一染色 (对应游戏里 T.MoneyColor 的效果): 把「数字+金/银/铜」包成带色的 span。
     列表是 innerHTML 拼出来的, 所以不逐个改渲染函数, 而是盯着 DOM 变动, 新出现的
     文字节点顺手染一遍; 已经在 .mg/.ms/.mc 里的跳过, 不会反复套色。 */
  function paintMoney(root) {
    if (!root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const jobs = [];
    let n;
    while ((n = walker.nextNode())) {
      const p = n.parentElement;
      if (!p || p.closest(".mg, .ms, .mc")) continue;
      if (!/\d[金银铜]/.test(n.nodeValue)) continue;
      jobs.push(n);
    }
    for (const node of jobs) {
      const s = node.nodeValue, re = /(\d+\.?\d*万?)([金银铜])/g;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      while ((m = re.exec(s))) {
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        const sp = document.createElement("span");
        sp.className = m[2] === "金" ? "mg" : m[2] === "银" ? "ms" : "mc";
        sp.textContent = m[0];
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if (!last) continue;
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  }

  new MutationObserver(muts => {
    for (const mu of muts) {
      if (mu.type === "characterData") {
        paintMoney(mu.target.parentElement);
      } else {
        for (const added of mu.addedNodes) {
          if (added.nodeType === 1) paintMoney(added);
          else if (added.nodeType === 3 && added.parentElement) paintMoney(added.parentElement);
        }
      }
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });

  function renderTabs() {
    $tabs.innerHTML = "";
    for (const key of Object.keys(PROF)) {
      const p = PROF[key];
      const b = document.createElement("button");
      b.className = "tab" + (key === curKey ? " on" : "");
      b.innerHTML = `<span class="tico ${p.cls}">${p.icon}</span>${p.name}`;
      b.onclick = () => { curKey = key; renderTabs(); renderList(); };
      $tabs.appendChild(b);
    }
  }

  function renderList() {
    const p = PROF[curKey];
    const cls = p.cls;
    let html = "";

    if (curMode === "mats") {
      summarize(p.rows).forEach(([n, c], i) => {
        const unit = (i * 733) % 8000 + 200;
        html += `<div class="blk${i % 2 ? " odd" : ""}">
          <div class="pline" data-name="${n}">
            <div class="ico ${cls}"></div>
            <div class="prod">
              <div class="pname">${n}<span class="pnpc">NPC ${money(npcSellOf(n))}</span></div>
              <div class="psell">单价 ${money(unit)}/个</div>
            </div>
            <div class="req gold">×${c}</div>
            <div class="prices"><div class="price gold">共 ${moneyEx(unit * c)}</div><div class="npcprice"></div></div>
            <div class="qbtn" style="visibility:hidden">查价</div>
          </div>
        </div>`;
      });
    } else {
      p.rows.forEach(([n, made, req, mats], i) => {
        const md = made > 1 ? ` <span class="dim">×${made}</span>` : "";
        html += `<div class="blk${i % 2 ? " odd" : ""}">
          <div class="pline" data-name="${n}" data-made="${made}">
            <div class="ico ${cls}"></div>
            <div class="prod">
              <div class="pname">${n}${md}<span class="pnpc">NPC ${money(npcSellOf(n))}</span></div>
              <div class="psell" data-made="${made}"></div>
            </div>
            <div class="req">[${req}]</div>
            <div class="prices"><div class="price"></div><div class="npcprice"></div></div>
            <div class="qbtn" data-i="${i}">查价</div>
          </div>
          ${matLines(mats)}
        </div>`;
      });
    }

    $list.innerHTML = html;
    $list.scrollTop = 0;
    $switch.textContent = curMode === "list" ? "材料汇总" : "配方列表";

    /* 列宽与 UI.lua 的 RowColumns 同一套算法:
       材料竖排后商品行只剩「图标 + 商品名 + 技能 + 盈亏 + 查价」,
       剩余宽度全给商品名 */
    const rowW = $list.clientWidth || 392;
    const priceW = Math.max(74, Math.min(98, rowW * 0.21));
    const rightFixed = 40 + 2 + 6 + priceW + 6 + 22;
    const titleW = Math.max(90, rowW - 22 - 8 - rightFixed);
    $list.style.setProperty("--tw", titleW.toFixed(1) + "px");
    $list.style.setProperty("--pw", priceW.toFixed(1) + "px");

    // 行悬停数据 (对应 ns.UI.ShowRowTooltip): 完整标题 + 材料清单
    const tipRows = curMode === "mats"
      ? summarize(p.rows).map(([n, c]) => ({
          title: n,
          sub: "材料汇总",
          mats: [],
          npc: "卖商人 " + money(npcSellOf(n)) + "/个",
          hint: "共需 ×" + c,
        }))
      : p.rows.map(([n, made, req, mats]) => {
          const md = made > 1 ? ` ×${made}` : "";
          let sub = "材料配方 · 技能 " + req;
          if (made > 1) sub += " · 一次做 " + made + " 个";
          return {
            title: n + md,
            sub,
            mats,
            npc: "卖商人 " + money(npcSellOf(n)) + "/个",
            hint: "点右边的「查价」看拍卖行价格与盈亏",
          };
        });
    [...$list.querySelectorAll(".blk")].forEach((el, i) => { el._tip = tipRows[i]; });

    // 查价按钮: 演示"查询中 n/m → 盈/亏"的过程, 并且**每查回一条就先画一条**
    // (对应实机 CheckRowPrice 的 onProgress → ApplyLivePrices)
    $list.querySelectorAll(".qbtn").forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const row = btn.closest(".blk");
        const cell = row.querySelector(".pline .price");

        // 拍卖行没开: 提示落在页面上, 不写聊天框 (与游戏内 CheckRowPrice 一致)
        if (!$ahOpen.checked) {
          showToast("查价需要先打开拍卖行 · 打开拍卖行窗口后再点「查价」", 5000);
          cell.className = "price gold";
          cell.textContent = "需开拍卖行";
          return;
        }

        const pline = row.querySelector(".pline");
        const made = Number((pline && pline.dataset.made) || 1) || 1;
        const mlines = [...row.querySelectorAll(".mline")];
        const total = 1 + mlines.length;
        const ps = row.querySelector(".psell");
        const prices = row.querySelector(".prices");

        // 上一轮的数字先擦掉 (实机点下去也清空, 免得看着像"点了没反应")
        if (ps) { ps.className = "psell"; ps.textContent = ""; }
        mlines.forEach(mc => {
          const mp = mc.querySelector(".mprice");
          if (mp) { mp.className = "mprice"; mp.textContent = ""; }
        });
        prices.innerHTML = "";
        btn.textContent = "查询中";
        cell.className = "price wait";
        cell.textContent = `0/${total}`;

        // 每点一次都当成一次全新查询 (对应游戏内 force 重查), 价格小幅浮动
        btn._n = (btn._n || 0) + 1;
        const seed = Number(btn.dataset.i) + 5 + btn._n * 3;
        const sell = (seed * 1370) % 9000 + 800;
        let cost = 0, done = 0;

        const timer = setInterval(() => {
          if (done === 0) {
            // 第 1 条: 产物售价 → 商品名下方 (made > 1 时写整份的售价, 与盈亏口径一致)
            if (ps) {
              ps.className = "psell";
              ps.innerHTML = made > 1
                ? "售价 " + matPriceHTML(sell, made, ps.clientWidth - 20)
                : "售价 " + moneyEx(sell) + "/个";
            }
          } else {
            // 之后每条: 一样材料的金额 → 它自己那一行右侧, 顺手累加成本
            const mc = mlines[done - 1];
            const mp = mc && mc.querySelector(".mprice");
            if (mp) {
              const cnt = Number(mc.dataset.cnt || 1) || 1;
              const unit = (seed * 733 + (done - 1) * 977) % 4000 + 150;
              cost += unit * cnt;
              mc.dataset.p = unit;               // 该行独立提示要用
              mp.className = "mprice";
              mp.innerHTML = matPriceHTML(unit, cnt, 84);
            }
          }
          done++;
          cell.textContent = `${done}/${total}`;

          if (done < total) return;
          clearInterval(timer);
          btn.textContent = "查价";

          // 全部回来的那一刻才算盈亏 (实机: 缺任何一项都不出盈亏)
          const ahProfit = Math.floor(sell * made * 0.95) - cost;
          const npcUnit = npcSellOf(pline ? pline.dataset.name : "");
          const npcProfit = npcUnit ? npcUnit * made - cost : null;
          prices.innerHTML = plHTML("AH", ahProfit) +
            (npcProfit === null
              ? `<div class="npcprice">NPC 不收</div>`
              : plHTML("NPC", npcProfit));
        }, 260);
      };
    });
  }

  /* ---------- 逐物悬停提示 ----------
     与游戏内一致: 指着哪样东西就只讲哪样 ——
       材料格  → 该材料的详情 (本配方要几个 / 单价 / 合计)
       行其它区 → 商品详情 (完整标题 / 技能 / 材料清单 / 成本盈亏)
     长名字被省略号截掉也能在这里看全 */
  const $tip = document.getElementById("tip");
  let tipTarget = null;

  function placeTip(e) {
    const pad = 14;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    const w = $tip.offsetWidth, h = $tip.offsetHeight;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
    $tip.style.left = x + "px";
    $tip.style.top = y + "px";
  }

  /* 材料行的独立提示数据 (对应 ns.UI.ShowMatTooltip) */
  function matTip(cell) {
    const name = cell.dataset.n;
    if (!name) return null;
    const cnt = Number(cell.dataset.cnt || 1) || 1;
    const unit = Number(cell.dataset.p || 0);
    const lines = [`本配方需要 ×${cnt}`];
    if (unit > 0) {
      lines.push(`拍卖行最低单价 ${money(unit)}/个`);
      lines.push(`${cnt} 个合计 ${money(unit * cnt)}`);
    } else {
      lines.push("还没有价格, 点右边「查价」");
    }
    const sell = npcSellOf(name), buy = npcBuyOf(name);
    lines.push(`卖商人 ${money(sell)}/个 · ${cnt} 个共 ${money(sell * cnt)}`);
    lines.push(buy ? `从商人买 ${money(buy)}/个 (自己记的价)` : "从商人买: 点「买价」格子自己记一个");
    return { title: name, sub: "材料", lines };
  }

  function showTip(el) {
    const t = el.classList.contains("mline") ? matTip(el) : el._tip;
    if (!t) return false;
    const html = [`<div class="t">${t.title}</div>`];

    /* 默认和游戏里一致: 只给「物品原来的介绍」, 我们自己那些行 (技能 / 材料 / 单价 /
       盈亏 / 商人价) 全部不显示 —— 游戏内在客户端原生提示后面才追加它们,
       而且要用 /wgm tip extra 手动打开。这里用一行说明代替原生那几行。 */
    if (!tipExtra) {
      html.push(`<div class="hint">客户端原生物品提示：名字 / 物品等级 / 用途 / 描述 / 售价</div>`);
      $tip.innerHTML = html.join("");
      $tip.classList.add("on");
      return true;
    }

    if (t.sub) html.push(`<div class="sub">${t.sub}</div>`);
    if (t.mats && t.mats.length) {
      html.push(...t.mats.map(([n, c]) =>
        `<div class="mrow"><span>${n}</span><span>×${c}</span></div>`));
    }
    if (t.npc) {
      html.push(`<div class="mrow"><span>${t.npc}</span><span></span></div>`);
    }
    if (t.lines && t.lines.length) {
      html.push(...t.lines.map(l => `<div class="mrow"><span>${l}</span><span></span></div>`));
    }
    if (t.hint) html.push(`<div class="hint">${t.hint}</div>`);
    $tip.innerHTML = html.join("");
    $tip.classList.add("on");
    return true;
  }

  /* 指针下真正要讲的对象: 有名字的材料行优先, 否则整块配方 */
  function tipTargetOf(el) {
    const cell = el.closest && el.closest(".mline");
    if (cell && cell.dataset.n) return cell;
    return (el.closest && el.closest(".blk")) || null;
  }

  $list.addEventListener("mousemove", e => {
    const target = tipTargetOf(e.target);
    if (target !== tipTarget) {
      tipTarget = target;
      if (!target || !showTip(target)) $tip.classList.remove("on");
    }
    if (target && $tip.classList.contains("on")) placeTip(e);
  });
  $list.addEventListener("mouseleave", () => {
    tipTarget = null;
    $tip.classList.remove("on");
  });

  $switch.onclick = () => {
    curMode = curMode === "list" ? "mats" : "list";
    renderList();
  };

  /* 点材料行的「买价」格子 → 弹出录入框 (对应 ns.UI.EditNpcPrice) */
  /* 金/银/铜 各一个格子, 下面那行把三段写成整钱 (对应游戏里的 ns.NPC.MoneyEx) */
  function splitMoney(s) {
    const g = /(\d+)金/.exec(s), si = /(\d+)银/.exec(s), c = /(\d+)铜/.exec(s);
    return [+(g ? g[1] : 0), +(si ? si[1] : 0), +(c ? c[1] : 0)];
  }
  function moneyFull(g, s, c) {
    if (g > 0) return `${g}金${s}银${c}铜`;
    if (s > 0) return `${s}银${c}铜`;
    return `${c}铜`;
  }
  const $npcEditor = document.getElementById("npcEditor");
  function setEditorMoney(g, s, c) {
    const vals = [g, s, c];
    $npcEditor.querySelectorAll(".ne-cell b").forEach((el, i) => { el.textContent = vals[i]; });
    const hint = $npcEditor.querySelector(".ne-hint");
    hint.textContent = "= " + moneyFull(g, s, c);
    hint.style.color = "var(--gold)";
  }
  $list.addEventListener("click", e => {
    const mb = e.target.closest && e.target.closest(".mbuy");
    if (!mb) return;
    e.stopPropagation();
    const row = mb.closest(".mline");
    $npcEditor.querySelector(".ne-who").textContent = row ? row.dataset.n : "";
    const raw = mb.classList.contains("empty") ? "1银20铜" : mb.textContent.replace(/^\s*买\s*/, "");
    setEditorMoney(...splitMoney(raw));
    $npcEditor.classList.add("on");
  });
  $npcEditor.querySelectorAll(".ne-btns button").forEach(b => {
    b.onclick = () => $npcEditor.classList.remove("on");
  });

  /* 左键点物品 (商品行 / 材料行) → 在拍卖行里搜索它 (对应 ns.UI.SearchInAH)。
     「买价」格子和「查价」按钮有自己的点击, 这里先排除掉 */
  $list.addEventListener("click", e => {
    const t = e.target;
    if (!t.closest || t.closest(".mbuy") || t.closest(".qbtn")) return;

    const ml = t.closest(".mline");
    const pl = t.closest(".pline");
    const name = ml ? ml.dataset.n
      : (pl && pl.dataset.name) || "";
    if (!name) return;

    if (!$ahOpen.checked) {
      showToast("拍卖行没打开 · 打开拍卖行窗口后, 点物品就能直接搜它", 4500);
      return;
    }
    showToast("拍卖行已搜索: " + name, 2500);
  });

  /* 截图/演示用: ?m=mats 直接进材料汇总模式; ?p=alchemy 直接落到某个专业 */
  const qs = new URLSearchParams(location.search);
  if (qs.get("m") === "mats") {
    curMode = "mats";
  }
  if (qs.get("p") && PROF[qs.get("p")]) {
    curKey = qs.get("p");
  }

  renderTabs();
  renderList();

  /* ==================== 其它 ==================== */
  for (const id of ["row1", "row2", "row3"]) {
    document.getElementById(id).onclick = e => e.currentTarget.classList.toggle("on");
  }

  /* 截图/演示用: preview.html?q=1 自动勾上「拍卖行已打开」, 并把前几个配方各查一遍价 */
  if (new URLSearchParams(location.search).get("q") === "1") {
    $ahOpen.checked = true;
    [...document.querySelectorAll(".blk .qbtn")].slice(0, 5).forEach((btn, i) => {
      setTimeout(() => btn.click(), 100 + i * 1100);
    });
  }

  /* 截图/演示用: ?edit=1 直接弹出 NPC 买价录入框 */
  if (new URLSearchParams(location.search).get("edit") === "1") {
    $npcEditor.classList.add("on");
  }

  /* 截图/演示用: ?tip=1 直接把第一块的行提示摆出来 (?extra=1 一起用可看完整版) */
  if (new URLSearchParams(location.search).get("tip") === "1") {
    setTimeout(() => {
      const blk = document.querySelector(".blk");
      if (!blk) return;
      const t = blk._tip;
      if (!t) return;
      $tip.innerHTML = "";
      showTip(blk);
      const r = blk.getBoundingClientRect();
      const w = $tip.offsetWidth, h = $tip.offsetHeight;
      let x = r.right + 16;
      if (x + w > window.innerWidth - 8) x = r.left - w - 16;
      let y = r.top + 24;
      if (y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
      $tip.style.left = x + "px";
      $tip.style.top  = y + "px";
      $tip.classList.add("on");
    }, 120);
  }

  const t0 = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    document.getElementById("sess").textContent = mm + ":" + ss;
  }, 1000);
</script>
</body>
</html>
